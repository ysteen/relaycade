name: Publish private DS WFC images

on:
  push:
    branches: [feature/ds-wfc]
  workflow_dispatch:
    inputs:
      romm_ref:
        description: RomM DS WFC branch or commit
        default: feature/ds-wfc
        type: string

permissions:
  contents: read

concurrency:
  group: private-wfc-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ysteen/relaycade' && github.event.repository.private && github.ref == 'refs/heads/feature/ds-wfc'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      ROMM_REPO_IMAGE: ghcr.io/ysteen/romm-wfc-private
      BRIDGE_REPO_IMAGE: ghcr.io/ysteen/retroarch-netplay-bridge-wfc-private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bridge
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ysteen/romm
          ref: ${{ inputs.romm_ref || 'feature/ds-wfc' }}
          path: romm
          persist-credentials: false
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for package in romm-wfc-private retroarch-netplay-bridge-wfc-private; do
            python3 romm/backend/tools/check_private_ghcr.py ysteen "$package" --allow-missing
          done
      - name: Set image references
        run: |
          revision=$(git -C romm rev-parse HEAD)
          echo "ROMM_REVISION=$revision" >> "$GITHUB_ENV"
          echo "ROMM_NETPLAY_IMAGE=$ROMM_REPO_IMAGE:sha-${revision:0:12}" >> "$GITHUB_ENV"
          echo "NETPLAY_BRIDGE_IMAGE=$BRIDGE_REPO_IMAGE:sha-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Build RomM image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: romm
          file: romm/docker/Dockerfile.custom-dosbox-pure
          platforms: linux/amd64
          load: true
          tags: ${{ env.ROMM_NETPLAY_IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/ysteen/relaycade
          build-args: ROMM_CUSTOM_REVISION=${{ env.ROMM_REVISION }}
          cache-from: type=gha,scope=netplay-romm-feature/ds-wfc
          cache-to: type=gha,mode=max,scope=netplay-romm-feature/ds-wfc
      - name: Build bridge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bridge
          platforms: linux/amd64
          load: true
          tags: ${{ env.NETPLAY_BRIDGE_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/ysteen/relaycade
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=netplay-wfc-bridge
          cache-to: type=gha,mode=max,scope=netplay-wfc-bridge
      - name: Check packaged runtime files
        run: |
          docker run --rm --entrypoint sh "$ROMM_NETPLAY_IMAGE" -ec '
            test -s /backend/handler/wfc_handler.py
            cd /var/www/html/assets/emulatorjs/data
            test -s src/wfc-session.js
            test -s cores/melondsds-wasm.data
            test -s cores/reports/melondsds.json
            grep -q EJS_loadInitialSave loader.js
          '
          docker run --rm --entrypoint sh "$NETPLAY_BRIDGE_IMAGE" -ec '
            test -x "$NETPLAY_WFC_HELPER"
            test -s /app/resources.mjs
            test -s /app/management.mjs
            test -s /app/admin-ui/index.html
          '
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push and verify private images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker push "$ROMM_NETPLAY_IMAGE"
          docker push "$NETPLAY_BRIDGE_IMAGE"
          for package in romm-wfc-private retroarch-netplay-bridge-wfc-private; do
            python3 romm/backend/tools/check_private_ghcr.py ysteen "$package"
          done
          printf '`ROMM_NETPLAY_IMAGE=%s`\n\n`NETPLAY_BRIDGE_IMAGE=%s`\n' \
            "$ROMM_NETPLAY_IMAGE" "$NETPLAY_BRIDGE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
