name: Relaycade

on:
  pull_request:
  push:
    branches: [main, feature/ds-wfc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check runtime compatibility in Windows PowerShell
        shell: powershell
        run: ./test/windows-runtime-compatibility.ps1 -Launcher ./client/windows-session.ps1

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install gateway dependencies
        run: npm ci --ignore-scripts

      - name: Test transport and rollback
        run: npm test

      - name: Build the gateway container
        run: docker build --file Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag netplay-bridge:ci --tag "netplay-bridge:sha-$GITHUB_SHA" .

      - name: Check container startup
        run: |
          docker run --detach --name netplay-bridge-ci --memory 256m --memory-swap 256m --cpus 2 --read-only --cap-drop ALL --security-opt no-new-privileges --env NETPLAY_BRIDGE_ADMIN_TOKEN=ci-disposable-token-at-least-24-characters netplay-bridge:ci
          for attempt in {1..20}; do
            if docker exec netplay-bridge-ci node -e "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs netplay-bridge-ci
          exit 1

      - name: Check packaged administrator UI
        run: |
          docker exec -i netplay-bridge-ci node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const base = "http://127.0.0.1:8080/v1/rooms/admin/ui/";
          assert.equal((await fetch(base)).status, 401);
          for (const file of ["index.html", "admin.js", "admin.css"]) {
            const response = await fetch(base + file, {
              headers: { Authorization: `Bearer ${process.env.NETPLAY_BRIDGE_ADMIN_TOKEN}` },
            });
            assert.equal(response.status, 200, file);
            assert.equal(response.headers.get("cache-control"), "no-store");
            assert((await response.arrayBuffer()).byteLength > 0);
          }
          NODE

      - name: Package the gateway image
        if: github.event_name != 'pull_request'
        run: docker save "netplay-bridge:sha-$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/netplay-bridge-image.tar.gz"

      - name: Upload the gateway image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netplay-bridge-image
          path: ${{ runner.temp }}/netplay-bridge-image.tar.gz
          compression-level: 0
          retention-days: 7

      - name: Remove test container
        if: always()
        run: docker rm --force netplay-bridge-ci || true
